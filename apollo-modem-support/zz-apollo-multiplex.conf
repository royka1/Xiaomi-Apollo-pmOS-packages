[Service]
# Ask for QMAP multiplexing on every bearer.
#
# Left to itself the bearer comes up raw-IP on mhi_hwip0, and the downlink
# wedges permanently after about ten megabytes -- a single speed test is enough
# to kill mobile data until the bearer is torn down. Multiplexed, the traffic
# runs over a qmapmux interface instead and sustained transfers survive.
#
# NetworkManager has no property for this, so it has to be asked for here, and
# the line has to be repeated because ExecStart is reset first: a drop-in can
# only replace the command, not add an argument to it. Sorted last so it wins
# over quick-suspend-resume.conf, whose argument is repeated here.
ExecStart=
ExecStart=/usr/sbin/ModemManager --test-quick-suspend-resume --test-multiplex-requested
