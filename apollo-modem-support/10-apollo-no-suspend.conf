# Suspend is off by default on this board.
#
# The SDX55 sits behind PCIe and its link does not survive a host suspend:
# driving the link down without a matching resume deadlocks the SoC, and the
# modem's own recovery path needs the link awake. Sensors and the audio DSP
# have their own trouble coming back. None of that is solved yet, so a suspend
# here is a reboot in practice.
#
# Remove this file to get suspend back.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
