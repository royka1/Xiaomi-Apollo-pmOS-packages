# This board has no writable RTC: RTC_SET_TIME fails with ENODEV, so the clock
# starts at the epoch on every boot. A 1970 clock makes every DNSSEC signature
# look expired, resolution stops, and timesyncd can then never resolve a pool
# hostname to correct the clock -- a deadlock that only breaks by hand, and
# which looks like "the modem registers but there is no internet".
#
# Addressing the servers by IP takes DNS out of that path. The hostnames are
# kept as a fallback for when these addresses stop answering.
[Time]
NTP=162.159.200.1 162.159.200.123 216.239.35.0 216.239.35.4
FallbackNTP=time.cloudflare.com time.google.com pool.ntp.org
