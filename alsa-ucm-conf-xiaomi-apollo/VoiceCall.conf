# UCM Voice Call profile for Xiaomi Mi 10T (Apollo / SM8250)
#
# callaudiod looks for a profile by this name before it does anything else and
# only falls back to switching the sink's output port when there is none. That
# fallback cannot work here: every UCM playback device ends up in its own
# profile with a single port, so the earpiece port is never on the sink that is
# currently open and the switch fails with "No such entity". With this verb it
# selects the profile instead, which is the path that does work.
#
# The routing is deliberately identical to HiFi's call routing -- the same
# backends, the same mic chain -- so that arriving here changes only which
# amplifier is playing. Call audio is built inside the ADSP and does not pass
# through any PCM userspace opens; q6voiced only opens the CS-VOICE front end,
# and these mixers are what give that session a device to reach.

SectionVerb {
	EnableSequence [
		cset "name='TERT_TDM_RX_0 Voice Mixer CS-Voice' 1"
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='LCV Analog PCM Volume' 18"
		cset "name='RCV Analog PCM Volume' 18"
		# Mic chain. A call selects no capture device, so without this
		# nothing connects AMIC5/AMIC1 through to TX_CODEC_DMA_TX_3 and
		# DAPM has no path to power up: the uplink goes silent while the
		# downlink still works.
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC3"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='HDR34 MUX' NO_HDR34"
		cset "name='ADC4 MUX' INP5"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='TX3 MODE' ADC_NORMAL"
		cset "name='ADC4 Volume' 15"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='ADC1 Volume' 15"
		cset "name='TX_DEC0 Volume' 110"
		cset "name='TX_DEC1 Volume' 110"
	]

	DisableSequence [
		# The amplifier the earpiece device silenced has to come back, or
		# music after the call plays out of one speaker.
		cset "name='Speaker Playback Switch' 1"
		cset "name='TERT_TDM_RX_0 Voice Mixer CS-Voice' 0"
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "Voice"
	}
}

# ── Playback devices ────────────────────────────────────────────────────────

SectionDevice."Earpiece" {
	Comment "Earpiece"

	# There is no separate earpiece part: the receiver is one of the two
	# CS35L41, so "earpiece" means the loudspeaker off rather than another
	# route on. The switches are the card's own -- muting has to happen on
	# the digital volume, since the analog gain bottoms out at +0.5 dB and
	# leaves a "muted" speaker plainly audible, and that is the register the
	# ganged master writes, so the card owns both.
	EnableSequence [
		cset "name='Speaker Playback Switch' 0"
		cset "name='Earpiece Playback Switch' 1"
	]

	DisableSequence [
		cset "name='Speaker Playback Switch' 1"
	]

	ConflictingDevice [
		"Speaker"
	]

	Value {
		# Above Speaker: a call starts at the ear, not on the desk.
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackVolume "Speaker Playback Volume"
	}
}

SectionDevice."Speaker" {
	Comment "Speakerphone"

	EnableSequence [
		cset "name='Speaker Playback Switch' 1"
		cset "name='Earpiece Playback Switch' 1"
	]

	DisableSequence [
	]

	ConflictingDevice [
		"Earpiece"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackVolume "Speaker Playback Volume"
	}
}

# ── Capture devices ─────────────────────────────────────────────────────────

SectionDevice."Internal Mic" {
	Comment "Top mic — AMIC5 (primary speech mic)"

	# Already wired up by the verb; a device has to exist for the profile to
	# carry a source at all.
	EnableSequence [
	]
	DisableSequence [
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
	}
}
