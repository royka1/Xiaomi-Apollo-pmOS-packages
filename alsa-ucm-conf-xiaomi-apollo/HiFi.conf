# UCM HiFi profile for Xiaomi Mi 10T (Apollo / SM8250)
#
# Hardware:
#   Speaker:      CS35L41 smart amp via TERT_TDM_RX_0 (hw:X10T,0)
#   Capture:      WCD938x via TX_CODEC_DMA_TX_3 (hw:X10T,1)
#   Primary mic:  AMIC5 (top mic)  — WCD ADC4/INP5, TX DEC0, ADC3
#   Reference mic: AMIC1 (bottom)  — WCD ADC1,     TX DEC1, ADC0
#   Headset mic:  AMIC2            — WCD ADC2/INP2, TX DEC0, ADC1
#
# Capture gains are measured here, not taken from Android's
# mixer_paths_overlay_static.xml. Its values (ADC4 6, TX_DEC0 87) leave normal
# speech at -37.7 dBFS peak / -60 dBFS RMS at the capture, which is below the
# AMR encoder's voice detector: with DTX on it emits silence descriptors, the
# modem consumes every frame, and the far end hears nothing. Android gets away
# with them because its vocproc topology has the gain the ADSP applies for it,
# which we cannot yet load. 110/15 puts speech at -5.8 dBFS peak / -23 dBFS.

SectionVerb {
	EnableSequence [
		# Speaker backend: CS35L41 via TERTIARY TDM (AFE port 0x9020),
		# which is what Android uses and where its call downlink lands.
		# An earlier TDM attempt was reverted because the right channel
		# never played; it mapped one receive slot per amplifier to the
		# codec's index and left the second at its default.
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		# Both CS35L41 amplifiers power up with their analog output stage
		# at gain 0, which the control itself reports as mute. Everything
		# upstream looks healthy - DAPM shows SPK/Main AMP/ASPRX1 on and
		# the PCM runs without a single kernel message - but nothing is
		# audible. 18 is what the stock firmware uses (RCV AMP PCM Gain).
		cset "name='LCV Analog PCM Volume' 18"
		cset "name='RCV Analog PCM Volume' 18"
		# Capture backend: WCD938x TX
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		# Call audio uses the same two backends. q6voiced only opens the
		# CS-VOICE front end; nothing else routes it, and without these
		# the DSP builds a complete voice session that reaches no device.
		cset "name='TERT_TDM_RX_0 Voice Mixer CS-Voice' 1"
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 1"
		# The mic chain has to be here too, not only in the capture
		# devices. A call selects no capture device, so nothing would
		# connect AMIC5/AMIC1 through to TX_CODEC_DMA_TX_3 and DAPM
		# would have no path to power up -- downlink worked because the
		# speaker route is in this verb, uplink was silent because its
		# counterpart was not. Two channels: top mic is speech, bottom
		# is the echo reference, as the stock system runs it.
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC3"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='HDR34 MUX' NO_HDR34"
		cset "name='ADC4 MUX' INP5"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='TX3 MODE' ADC_NORMAL"
		cset "name='ADC4 Volume' 15"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='ADC1 Volume' 15"
		cset "name='TX_DEC0 Volume' 110"
		cset "name='TX_DEC1 Volume' 110"
	]

	DisableSequence [
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='TERT_TDM_RX_0 Voice Mixer CS-Voice' 0"
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

# ── Playback devices ────────────────────────────────────────────────────────

SectionDevice."Speaker" {
	Comment "Built-in speakers (CS35L41)"

	# No DAPM routing needed: CS35L41 is always connected to TERT MI2S
	EnableSequence [
	]
	DisableSequence [
	]

	# Both amplifiers audible again after the earpiece muted one of them.
	EnableSequence [
		cset "name='Speaker Playback Switch' 1"
		cset "name='Earpiece Playback Switch' 1"
	]

	# Declared conflicting so that selecting one actually runs the other's
	# disable sequence; without it the profile switch is a no-op and the
	# loudspeaker never comes back.
	ConflictingDevice [
		"Earpiece"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		# Gangs both CS35L41. It is the only gain in both the music and
		# the call path -- call audio is mixed in the ADSP and never
		# reaches userspace, so a software volume cannot touch it.
		PlaybackVolume "Speaker Playback Volume"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece (CS35L41 at 0x42, prefixed LCV)"

	# There is no separate earpiece part: the receiver is one of the two
	# CS35L41, so "earpiece" means the loudspeaker off rather than another
	# route on.
	#
	# The switches are the card's own, not the amplifiers'. Muting has to
	# happen on the digital volume -- the analog gain bottoms out at
	# +0.5 dB and leaves a "muted" speaker plainly audible -- and that is
	# the same register the ganged master writes, so the card owns both and
	# these only tell it which amplifiers the volume still reaches.
	EnableSequence [
		cset "name='Speaker Playback Switch' 0"
		cset "name='Earpiece Playback Switch' 1"
	]

	DisableSequence [
		cset "name='Speaker Playback Switch' 1"
	]

	ConflictingDevice [
		"Speaker"
	]

	Value {
		# Below Speaker, so ordinary playback still defaults to both.
		# callaudiod picks this one by name when a call starts.
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackVolume "Speaker Playback Volume"
	}
}

# ── Capture devices ─────────────────────────────────────────────────────────

SectionDevice."Internal Mic" {
	Comment "Top mic — AMIC5 (primary speech mic)"

	EnableSequence [
		# TX macro: DEC0 → SWR ADC3 → WCD ADC4/INP5
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC3"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		# WCD938x: ADC4 → AMIC5 (INP5)
		cset "name='HDR34 MUX' NO_HDR34"
		cset "name='ADC4 MUX' INP5"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='TX3 MODE' ADC_NORMAL"
		cset "name='ADC4 Volume' 15"
		cset "name='TX_DEC0 Volume' 110"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='TX3 MODE' ADC_INVALID"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureVolume "ADC4 Volume"
	}
}

SectionDevice."Dual Mic" {
	Comment "Dual mic: AMIC5 top (ch0) + AMIC1 bottom AEC ref (ch1)"

	EnableSequence [
		# DEC0 → ADC3 → AMIC5 (top, primary speech).
		#
		# These have to be set here, not only in the verb. Headset Mic
		# points TX SMIC MUX0 at ADC1 and nothing put it back, so once
		# that device had been selected DEC0 stayed on a dead input for
		# the rest of the boot: capture still worked, at the dither
		# floor, and the far end of a call heard nothing.
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC3"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='HDR34 MUX' NO_HDR34"
		cset "name='ADC4 MUX' INP5"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='TX3 MODE' ADC_NORMAL"
		# DEC1 → ADC0 → AMIC1 (bottom, AEC reference)
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='ADC1 Volume' 15"
		cset "name='TX_DEC0 Volume' 110"
		cset "name='TX_DEC1 Volume' 110"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='TX DEC1 MUX' MSM_DMIC"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='TX3 MODE' ADC_INVALID"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX0 MODE' ADC_INVALID"
	]

	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
	}
}

SectionDevice."Headset Mic" {
	Comment "Headset mic — AMIC2 (WCD ADC2/INP2)"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='TX1 MODE' ADC_NORMAL"
		cset "name='ADC2 Volume' 20"
		cset "name='TX_DEC0 Volume' 110"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='TX1 MODE' ADC_INVALID"
		# Hand the shared mux back to the internal mic.
		cset "name='TX SMIC MUX0' ADC3"
	]

	ConflictingDevice [
		"Internal Mic"
		"Dual Mic"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		JackControl "Headset Mic Jack"
	}
}
