# UCM HiFi profile for Xiaomi Mi 10T (Apollo / SM8250)
#
# Hardware:
#   Speaker:      CS35L41 smart amp via TERT_MI2S_RX (hw:X10T,0)
#   Capture:      WCD938x via TX_CODEC_DMA_TX_3 (hw:X10T,1)
#   Primary mic:  AMIC5 (top mic)  — WCD ADC4/INP5, TX DEC0, ADC3
#   Reference mic: AMIC1 (bottom)  — WCD ADC1,     TX DEC1, ADC0
#   Headset mic:  AMIC2            — WCD ADC2/INP2, TX DEC0, ADC1
#
# Volumes from Android mixer_paths_overlay_static.xml:
#   ADC4 Volume = 6   (30 dB scale, 6 = ~9 dB)
#   ADC1 Volume = 6
#   TX_DEC0 Volume = 87 (dB scale, 87 = 3 dB)

SectionVerb {
	EnableSequence [
		# Speaker backend: CS35L41 via TERTIARY MI2S (AFE port 0x1004).
		# TDM was tried at length against the vendor driver and a live stock
		# mixer dump; the right channel never plays on it. On MI2S both do.
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
		# Both CS35L41 amplifiers power up with their analog output stage
		# at gain 0, which the control itself reports as mute. Everything
		# upstream looks healthy - DAPM shows SPK/Main AMP/ASPRX1 on and
		# the PCM runs without a single kernel message - but nothing is
		# audible. 18 is what the stock firmware uses (RCV AMP PCM Gain).
		cset "name='LCV Analog PCM Volume' 18"
		cset "name='RCV Analog PCM Volume' 18"
		# Capture backend: WCD938x TX
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

# ── Playback devices ────────────────────────────────────────────────────────

SectionDevice."Speaker" {
	Comment "Built-in speakers (CS35L41)"

	# No DAPM routing needed: CS35L41 is always connected to TERT MI2S
	EnableSequence [
	]
	DisableSequence [
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# ── Capture devices ─────────────────────────────────────────────────────────

SectionDevice."Internal Mic" {
	Comment "Top mic — AMIC5 (primary speech mic)"

	EnableSequence [
		# TX macro: DEC0 → SWR ADC3 → WCD ADC4/INP5
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC3"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		# WCD938x: ADC4 → AMIC5 (INP5)
		cset "name='HDR34 MUX' NO_HDR34"
		cset "name='ADC4 MUX' INP5"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='TX3 MODE' ADC_NORMAL"
		cset "name='ADC4 Volume' 6"
		cset "name='TX_DEC0 Volume' 87"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='TX3 MODE' ADC_INVALID"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureVolume "ADC4 Volume"
	}
}

SectionDevice."Dual Mic" {
	Comment "Dual mic: AMIC5 top (ch0) + AMIC1 bottom AEC ref (ch1)"

	EnableSequence [
		# DEC0 → ADC3 → AMIC5 (top, primary speech)
#		cset "name='TX DEC0 MUX' SWR_MIC"
#		cset "name='TX SMIC MUX0' ADC3"
#		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
#		cset "name='HDR34 MUX' NO_HDR34"
#		cset "name='ADC4 MUX' INP5"
#		cset "name='ADC4 Switch' 1"
#		cset "name='ADC4_MIXER Switch' 1"
#		cset "name='TX3 MODE' ADC_NORMAL"
#		cset "name='ADC4 Volume' 6"
		# DEC1 → ADC0 → AMIC1 (bottom, AEC reference)
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='ADC1 Volume' 12"
		cset "name='TX_DEC0 Volume' 87"
		cset "name='TX_DEC1 Volume' 87"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='TX DEC1 MUX' MSM_DMIC"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='TX3 MODE' ADC_INVALID"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX0 MODE' ADC_INVALID"
	]

	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
	}
}

SectionDevice."Headset Mic" {
	Comment "Headset mic — AMIC2 (WCD ADC2/INP2)"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='TX1 MODE' ADC_NORMAL"
		cset "name='ADC2 Volume' 20"
		cset "name='TX_DEC0 Volume' 87"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='TX1 MODE' ADC_INVALID"
	]

	ConflictingDevice [
		"Internal Mic"
		"Dual Mic"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		JackControl "Headset Mic Jack"
	}
}
